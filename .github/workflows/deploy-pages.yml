name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "web/public/**"
      - "supabase/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Write Supabase config from secrets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          CHORES_POLL_MS: ${{ vars.CHORES_POLL_MS }}
        run: |
          node <<'EOF'
          const fs = require("fs");
          const cfg = {
            supabaseUrl: process.env.SUPABASE_URL || "",
            supabaseAnonKey: process.env.SUPABASE_ANON_KEY || "",
            pollIntervalMs: Number(process.env.CHORES_POLL_MS || 10000) || 10000,
          };
          fs.writeFileSync(
            "web/public/config.js",
            `window.CHORES_CONFIG = ${JSON.stringify(cfg, null, 2)};\n`,
          );
          if (!cfg.supabaseUrl || !cfg.supabaseAnonKey) {
            console.log("No Supabase secrets set; Pages will use localStorage fallback.");
          } else {
            console.log("Wrote Supabase config for Pages deploy.");
          }
          EOF

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
