name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "web/public/**"
      - "supabase/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Write Supabase config
        env:
          # Prefer chores-specific secrets; fall back to Comparison-tool names,
          # then to the committed School Compass publishable defaults.
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || secrets.NEXT_PUBLIC_SUPABASE_URL || secrets.SCHOOL_COMPASS_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          CHORES_POLL_MS: ${{ vars.CHORES_POLL_MS }}
        run: |
          node <<'EOF'
          const fs = require("fs");
          const defaults = {
            supabaseUrl: "https://djjpznwiujujfoyvkmsp.supabase.co",
            supabaseAnonKey: "sb_publishable_m5wzERqw-Qlp239zQ7eVaA_kOPsXxfJ",
            pollIntervalMs: 10000,
          };
          const cfg = {
            supabaseUrl: process.env.SUPABASE_URL || defaults.supabaseUrl,
            supabaseAnonKey: process.env.SUPABASE_ANON_KEY || defaults.supabaseAnonKey,
            pollIntervalMs: Number(process.env.CHORES_POLL_MS || defaults.pollIntervalMs) || 10000,
          };
          fs.writeFileSync(
            "web/public/config.js",
            `window.CHORES_CONFIG = ${JSON.stringify(cfg, null, 2)};\n`,
          );
          console.log(`Supabase host: ${new URL(cfg.supabaseUrl).host}`);
          EOF

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          # Create/enable the Pages site for Actions builds when missing.
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
