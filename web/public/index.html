<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#1f6f5b" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Chores" />
    <meta
      name="description"
      content="Track household chores on iPhone and iPad."
    />
    <title>Chores</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./icon.svg" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Figtree:wght@500;600;700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="atmosphere" aria-hidden="true"></div>
    <div class="app">
      <header class="top">
        <div class="brand-block">
          <p class="brand">Chores</p>
          <p class="tagline" id="summary">Loading your household list…</p>
        </div>
        <div class="filters" role="tablist" aria-label="Chore filters">
          <button class="filter is-active" data-filter="open" role="tab" aria-selected="true">
            Open
          </button>
          <button class="filter" data-filter="done" role="tab" aria-selected="false">
            Done
          </button>
          <button class="filter" data-filter="all" role="tab" aria-selected="false">
            All
          </button>
        </div>
      </header>

      <main>
        <section class="list-panel" aria-labelledby="list-heading">
          <h1 id="list-heading" class="visually-hidden">Household chores</h1>
          <ul id="chore-list" class="chore-list"></ul>
          <p id="empty-state" class="empty-state hidden">
            Nothing here yet. Add the next household task below.
          </p>
        </section>
      </main>

      <form id="add-form" class="composer" autocomplete="off">
        <label class="composer-label" for="title">New chore</label>
        <div class="composer-row">
          <input
            id="title"
            name="title"
            type="text"
            enterkeyhint="done"
            placeholder="What needs doing?"
            required
            maxlength="120"
          />
          <button type="submit" class="primary">Add</button>
        </div>
        <div class="composer-meta">
          <input
            id="assignee"
            name="assignee"
            type="text"
            placeholder="Who?"
            maxlength="40"
            aria-label="Assignee"
          />
          <input
            id="dueDate"
            name="dueDate"
            type="date"
            aria-label="Due date"
          />
        </div>
        <p id="form-status" class="form-status" role="status" aria-live="polite"></p>
      </form>
    </div>
    <script src="./app.js" type="module"></script>
  </body>
</html>
